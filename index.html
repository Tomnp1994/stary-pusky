<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STARÝ PUŠKY — Vánoční besídka</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bungee&family=Caveat:wght@500;700&family=Rubik:wght@400;500;700;800&display=swap');

:root{
  --wood:#2a170d; --wood2:#4a2a15;
  --board:#1d2624; --board2:#141b1a;
  --chalk:#f4f1e6; --chalk-dim:#b9b6a8;
  --gold:#ffc861; --amber:#ffa53d;
  --red:#a8232f; --red2:#d23a46;
  --pink:#f4a6b8; --mint:#a8d8c0; --sand:#e6cfa8;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  min-height:100vh;
  font-family:'Rubik',sans-serif;
  color:var(--chalk);
  background:
    radial-gradient(ellipse 60% 45% at 50% 0%, rgba(255,170,70,.28), transparent 70%),
    radial-gradient(ellipse 40% 40% at 5% 60%, rgba(120,60,20,.35), transparent 70%),
    radial-gradient(ellipse 40% 40% at 95% 55%, rgba(168,35,47,.22), transparent 70%),
    linear-gradient(180deg,#140c08 0%,#1b0f09 60%,#2a170d 100%);
  overflow-x:hidden;
}

/* ---------- ambient: bokeh + lights ---------- */
.bokeh{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.bokeh i{
  position:absolute;border-radius:50%;
  background:radial-gradient(circle,rgba(255,206,120,.55),rgba(255,170,70,.12) 60%,transparent 70%);
  filter:blur(3px);opacity:.5;
  animation:twinkle ease-in-out infinite;
}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.85)}50%{opacity:.7;transform:scale(1.1)}}

.lights{position:relative;z-index:2;display:flex;justify-content:space-between;padding:0 8px;height:46px;}
.lights:before{
  content:"";position:absolute;left:-2%;right:-2%;top:-14px;height:34px;
  border-bottom:2px solid #3a2a1c;border-radius:0 0 50% 50% / 0 0 100% 100%;
}
.lights span{
  position:relative;width:12px;height:18px;border-radius:50% 50% 50% 50%/40% 40% 60% 60%;
  margin-top:10px;animation:bulb 2.4s ease-in-out infinite;
  box-shadow:0 0 14px 4px var(--c);background:var(--c);
}
.lights span:nth-child(odd){margin-top:18px;}
@keyframes bulb{0%,100%{opacity:1}50%{opacity:.35}}

main{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:6px 16px 40px;}
[hidden]{display:none !important;}

/* ---------- hub ---------- */
.hero{text-align:center;padding:10px 0 20px;}
.kicker{font-family:'Caveat',cursive;font-size:clamp(26px,5vw,36px);color:var(--pink);font-weight:700;letter-spacing:1px;}
.hero h1{
  font-family:'Bungee',cursive;margin:0;line-height:1.05;
  font-size:clamp(40px,10vw,84px);
  color:var(--gold);
  text-shadow:3px 3px 0 var(--red),0 0 28px rgba(255,170,70,.55);
  transform:rotate(-2deg);
}
.hero p{font-family:'Caveat',cursive;font-size:clamp(20px,4vw,26px);color:var(--sand);margin:12px 0 0;}

.board{
  position:relative;margin-top:10px;padding:26px 18px 30px;border-radius:14px;
  background:
    radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.06), transparent 60%),
    repeating-linear-gradient(100deg,rgba(255,255,255,.02) 0 3px,transparent 3px 11px),
    linear-gradient(145deg,var(--board),var(--board2));
  border:10px solid transparent;
  border-image:linear-gradient(135deg,#7a4a22,#c98c3e,#7a4a22,#b5782f) 1;
  box-shadow:0 0 0 2px rgba(255,200,100,.25),0 0 50px rgba(255,170,70,.3),0 22px 40px rgba(0,0,0,.5);
}
.board-title{
  font-family:'Caveat',cursive;font-weight:700;text-align:center;
  font-size:clamp(30px,6vw,44px);color:var(--chalk);
  border-bottom:2px dashed rgba(244,241,230,.35);padding-bottom:6px;margin-bottom:22px;
}
.board-title small{display:block;font-size:.5em;color:var(--chalk-dim);font-weight:500;}

.menu-grid{display:grid;grid-template-columns:1fr;gap:18px;}
@media(min-width:700px){.menu-grid{grid-template-columns:1fr 1fr;}}

.plate{
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  min-height:210px;padding:22px 16px;border-radius:16px;text-decoration:none;color:#fff;cursor:pointer;
  border:3px solid rgba(255,255,255,.85);
  font-family:inherit;text-align:center;
  transition:transform .18s, box-shadow .18s;
  overflow:hidden;
}
.plate:hover{transform:translateY(-6px) rotate(-.8deg);}
.plate:active{transform:translateY(0) scale(.98);}
.plate .ico{font-size:64px;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4));}
.plate .t{font-family:'Bungee',cursive;font-size:clamp(24px,5vw,32px);line-height:1.1;text-shadow:2px 2px 0 rgba(0,0,0,.35);}
.plate .d{font-family:'Caveat',cursive;font-size:22px;opacity:.95;}
.plate:after{ /* bow-tie ribbon corner */
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(120deg,rgba(255,255,255,.18),transparent 35%);
}
.plate-penalty{
  background:linear-gradient(145deg,#c22a38,#7d1620);
  box-shadow:0 8px 0 #4d0c14,0 0 30px rgba(210,58,70,.35);
}
.plate-penalty .ico{animation:wobble 2.6s ease-in-out infinite;}
@keyframes wobble{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.plate-arena{
  background:linear-gradient(145deg,#2a8d6e,#17594a);
  box-shadow:0 8px 0 #0d3b30,0 0 30px rgba(168,216,192,.28);
  border-color:rgba(255,255,255,.85);
}
.plate-arena .ico{animation:spin 3s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.plate-wheel{
  background:linear-gradient(145deg,#c89b3c,#7a5518);
  box-shadow:0 8px 0 #4a3310,0 0 30px rgba(231,200,120,.35);
  min-height:170px;
}
.plate-wheel .ico{animation:wobble 3.2s ease-in-out infinite;}
@media(min-width:700px){.plate-wheel{grid-column:1 / -1;}}
.plate .tie{position:absolute;top:10px;right:12px;font-size:26px;}

.candles{display:flex;justify-content:center;gap:34px;margin-top:26px;font-size:34px;}
.candles span{animation:flame 1.6s ease-in-out infinite;filter:drop-shadow(0 0 12px rgba(255,170,70,.9));}
.candles span:nth-child(2){animation-delay:.5s}.candles span:nth-child(3){animation-delay:1s}
@keyframes flame{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.08) rotate(2deg)}}
footer{text-align:center;font-family:'Caveat',cursive;font-size:20px;color:var(--chalk-dim);margin-top:14px;}

</style>
</head>
<body>

<div class="bokeh" id="bokeh"></div>
<div class="lights" id="lights"></div>

<main>

  <!-- ===================== ROZCESTNÍK ===================== -->
  <section id="view-hub">
    <div class="hero">
      <div class="kicker">✨ Vánoční besídka ✨</div>
      <h1>STARÝ<br>PUŠKY</h1>
      <p>Co si dneska dáme, pánové?</p>
    </div>

    <div class="board">
      <div class="board-title">Dnešní menu<small>vyber si, na čem si pochutnáš</small></div>
      <div class="menu-grid">
        <a class="plate plate-penalty" href="trestnej.html">
          <span class="tie">🎀</span>
          <span class="ico">🥃</span>
          <span class="t">Máš trestnej!</span>
          <span class="d">Škrábni los a uvidíš, co tě čeká</span>
        </a>
        <a class="plate plate-arena" href="arena.html">
          <span class="tie">🎀</span>
          <span class="ico">🌀</span>
          <span class="t">Beyblade aréna</span>
          <span class="d">Turnaj, pavouk a sázky o panáky</span>
        </a>
        <a class="plate plate-wheel" href="kolo.html">
          <span class="tie">🎀</span>
          <span class="ico">🎡</span>
          <span class="t">Kolo štěstí</span>
          <span class="d">Zatoč a zjisti, co budeš vařit</span>
        </a>
      </div>
    </div>

    <div class="candles"><span>🕯️</span><span>🕯️</span><span>🕯️</span></div>
    <footer>Sestrojeno v tajné dílně Starých Pušek 🎄</footer>
  </section>

</main>

<script>

/* ---------------- ambient ---------------- */
(function(){
  const bokeh=document.getElementById('bokeh');
  for(let i=0;i<26;i++){
    const el=document.createElement('i');
    const s=24+Math.random()*90;
    el.style.width=el.style.height=s+'px';
    el.style.left=(Math.random()*100)+'%';
    el.style.top=(Math.random()*100)+'%';
    el.style.animationDuration=(3+Math.random()*5)+'s';
    el.style.animationDelay=(-Math.random()*6)+'s';
    bokeh.appendChild(el);
  }
  const lights=document.getElementById('lights');
  const cols=['#ffd27a','#ff7a7a','#a8d8c0','#f4a6b8','#7ad0ff'];
  for(let i=0;i<22;i++){
    const b=document.createElement('span');
    b.style.setProperty('--c',cols[i%cols.length]);
    b.style.animationDelay=(-Math.random()*2.4)+'s';
    lights.appendChild(b);
  }
})();
</script>
</body>
</html>
